services:
  - type: web
    name: coachfee
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: GATEWAY_HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: coachfee-db
          property: connectionString

databases:
  - name: coachfee-db
    plan: free
